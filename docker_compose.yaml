services:
  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: django-backend
    container_name: weather-app
    restart: on-failure
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - postgres

    networks:
      - app-network
    ports:
      - "${DJANGO_PORT}:8000"

  postgres:
    image: postgres
    restart: always
    container_name: weather-db
    env_file:
      - .env
    volumes:
      - weather_db_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_NAME}

    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    container_name: weather-cache
    networks:
      - app-network


volumes:
  weather_db_data:


networks:
  app-network:
    driver: bridge
